# ArgoCD Application CR — myapp Dev Environment
# Applied once: oc apply -f manifests/ -n openshift-gitops
# After this, ArgoCD manages itself and syncs automatically

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-dev
  namespace: openshift-gitops
  labels:
    app: myapp
    env: dev
spec:
  project: default

  source:
    repoURL: https://gitlab.example.com/platform/myapp-manifests.git
    targetRevision: main
    path: helm/myapp-chart
    helm:
      valueFiles:
        - values-dev.yaml     # environment-specific overrides

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-dev

  syncPolicy:
    automated:
      prune: true             # delete resources removed from manifests
      selfHeal: true          # revert manual cluster changes back to git state
    syncOptions:
      - CreateNamespace=true  # create namespace if it doesn't exist
      - ServerSideApply=true

---
# ArgoCD Application CR — myapp Lab Environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-lab
  namespace: openshift-gitops
  labels:
    app: myapp
    env: lab
spec:
  project: default

  source:
    repoURL: https://gitlab.example.com/platform/myapp-manifests.git
    targetRevision: main
    path: helm/myapp-chart
    helm:
      valueFiles:
        - values-lab.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-lab

  syncPolicy:
    automated: {}             # automated sync, no selfHeal for lab
    syncOptions:
      - CreateNamespace=true
