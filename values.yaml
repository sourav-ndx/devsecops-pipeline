# Base values — overridden by environment-specific files
replicaCount: 1

image:
  repository: quay.example.com/myorg/myapp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  logLevel: INFO
  environment: base
